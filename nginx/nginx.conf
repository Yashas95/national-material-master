# ==============================================================================
# NUMMF Production Nginx Reverse Proxy Configuration
# Unified single-port hosting for static frontend and Express backend APIs
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream Backend API Service
    upstream backend_api {
        server api:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend Static Asset Directory
        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------------------
        # Backend API Reverse Proxy (/api/*)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for long-running batch ingestion & BullMQ queries
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Request payload limits (bulk CSV uploads)
            client_max_body_size 50M;
        }

        # ----------------------------------------------------------------------
        # Health Check Proxy (/health)
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Static Assets with Browser Caching
        # ----------------------------------------------------------------------
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # SPA Single-Page Client Routing
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
